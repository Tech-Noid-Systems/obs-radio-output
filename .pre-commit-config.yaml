# Pre-commit hooks — run the same formatting / linting checks locally that CI
# enforces in `.github/workflows/check-format.yaml` and
# `.github/workflows/clang-tidy.yaml`.  Install once per clone with:
#
#   pipx install pre-commit      # or: brew install pre-commit
#   pre-commit install
#
# After that, every `git commit` runs these hooks against the staged files.
# To run against the whole tree: `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml
        # .clang-format uses multi-document YAML (--- separators) by convention.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.3
    hooks:
      - id: clang-format
        # Match CI: only our own C/C++ sources.
        files: ^src/.*\.(c|h|cpp|hpp)$

  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.19.3
    hooks:
      - id: gersemi
        # Only CMake entry point; buildspec/presets are JSON, handled above.
        files: ^(CMakeLists\.txt|.*\.cmake)$
